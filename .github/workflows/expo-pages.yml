name: Expo web — validate and deploy Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expo-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/highest-rite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/highest-rite/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:source
      - run: pnpm build:web
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-export.py
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - run: python scripts/test-web.py
      - uses: actions/upload-artifact@v4
        with:
          name: expo-web-test-evidence
          path: source/highest-rite/test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: source/highest-rite/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated Expo web app
        id: deployment
        uses: actions/deploy-pages@v4
