  <text x="90" y="466" fill="#b5ad9c" font-family="Arial, sans-serif" font-size="26">Build with intent. Own the outcome.</text>
  <line x1="90" y1="520" x2="690" y2="520" stroke="#8f753a" opacity=".5"/>
