  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="70%">
      <stop offset="0" stop-color="#4b3d1e"/>
      <stop offset="0.55" stop-color="#15120c"/>
      <stop offset="1" stop-color="#090909"/>
